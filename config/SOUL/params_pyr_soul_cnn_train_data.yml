---
# Training of the Conv2dNetRec reconstructor for SOUL's non-modulated pyramid.
#
#   specula params_pyr_soul.yml params_pyr_soul_cnn_train_data.yml
#
# The loop is closed by the linear reconstructor (`rec` + `control`) under
# deliberately varied conditions. slopes2d, modal_analysis and data_buffer only
# tap it: nn_trainer learns to predict the residual modes (modal_analysis) from
# the slope map, and saves the checkpoint that params_pyr_soul_cnn_test_data.yml
# and params_pyr_soul_cnn_closed_loop.yml load.

pyramid_override:
  mod_amp: 0.0   # non-modulated pyramid

# --- Varying atmosphere ------------------------------------------------------
# Seeing and wind speed are redrawn every 2 and 3 s, on integer seconds, so the
# network learns over a range of conditions. The wind direction is drawn once
# per run and then held: AtmoEvolution rotates each layer by it, so a new
# direction rotates the whole phase map under the pupil at once -- a step as
# large as the full turbulence, which the non-modulated pyramid cannot always
# re-acquire from (the Strehl fell to 0 at every such redraw, and one of them
# lost the loop for good). A new speed only changes how fast the layers move,
# and a new seeing scales them: the loop rides both out.
# They are removed and redefined, not overridden, because their class changes
# (an _override cannot drop the old class's keys); removing them also drops
# atmo's wires to them, restated in atmo_override.
# data_store is not needed here, and its store_dir in the base config is not
# writable for everyone.
remove: ['seeing', 'wind_speed', 'wind_direction', 'data_store']

seeing:
  class:             'PeriodicRandomGenerator'
  update_interval:   2.0                    # [s]
  distribution:      'UNIFORM'
  constant:          [0.9]                  # ["]
  amp:               [0.6]                  # ["] -> uniform in [0.6, 1.2]
  output_size:       1

wind_speed:
  class:             'PeriodicRandomGenerator'
  update_interval:   3.0                    # [s]
  distribution:      'UNIFORM'
  constant:          [2., 4., 6., 25.]      # [m/s] one per layer, the base config's values
  amp:               [2., 4., 6., 25.]      # [m/s] -> uniform in [0, 2x nominal]
  output_size:       4

wind_direction:
  class:             'PeriodicRandomGenerator'
  update_interval:   1000000.0              # [s] longer than any run: one draw per run
  distribution:      'UNIFORM'
  constant:          [0., 30., -30., 45.]   # [deg] one per layer, the base config's values
  amp:               [180., 180., 180., 180.]  # [deg] -> +/-90 deg around them
  output_size:       4

atmo_override:
  inputs:
    seeing:          'seeing.output'
    wind_speed:       'wind_speed.output'
    wind_direction:   'wind_direction.output'

# --- Loop opening -------------------------------------------------------------
# A square wave in {0, 1}: the loop is closed for 95% of each second and open
# for 50 ms, so the data include the loop pulling in from a large residual --
# what the CNN has to do when it drives the loop. The opening falls at
# k + 0.25 s, away from every redraw (seeing and wind speed on integer seconds,
# per-mode gains every 0.5 s): a loop that re-closes into new, worse conditions
# can end up outside the non-modulated pyramid's linear range and never recover.
gain_mod_wave:
  class:             'WaveGenerator'
  wave_type:         'SQUARE'
  freq:              [1.0]
  amp:               [0.5]                  # amp and constant map the wave's
  constant:          [0.5]                  # +/-1 to {0, 1}
  duty_cycle:        [0.95]
  offset:            [4.39822971502571]     # 0.70 * 2*pi: opens at k + 0.25 s
  outputs: ['output']

# --- Randomized per-mode loop gains ---------------------------------------------
# At the nominal gains the loop holds each mode from 50 up at ~2 nm, below the
# noise: nothing, CNN or linear, can learn them from such data, and the data
# never show them large -- as they are whenever the loop runs on an imperfect
# reconstructor. So every 0.5 s a random subset of those modes has its gain
# scaled by a factor in [0.3, 1): 15% of modes 50-199, 20% of modes 200-629.
# Modes 0-49 always keep the nominal gain.
# The fractions and the 0.3 floor are a stability limit: the low-order loop
# runs close to its own, and de-gaining too many modes at once (40% of modes
# 200-629) pushed the residual out of the pyramid's linear range and made the
# whole loop diverge.
modal_gain_mod:
  class:             'ModalGainModulation'
  n_modes:           630                    # one factor per control filter
  tiers:             [[50, 200, 0.15], [200, 630, 0.20]]   # [first, end, fraction]
  min_factor:        0.3
  update_interval:   0.5                    # [s]
  inputs:
    gain_mod:        'gain_mod_wave.output' # the loop opening, on every mode
  outputs: ['out_gain_mod']

control_override:
  # The linear loop's tuning, one gain per mode range, shared by
  # params_pyr_soul_cnn_test_data.yml and by both closed-loop configs. The
  # groups add up to the 630 modes rec outputs (an Integrator needs one filter
  # per mode). Modes 100-629 are corrected too: left alone, their residual
  # aliases into the slopes and modes 20-99 can no longer be predicted.
  #                 0-29    30-99     100-199   200-499   500-629
  n_modes:           [30,     70,       100,      300,      130]
  int_gain:          [0.45,   0.35,     0.18,     0.08,     0.05]
  ff:                [1.0,    0.999996, 0.999365, 0.977895, 0.99]
  inputs:
    delta_comm:      'rec.out_modes'
    gain_mod:        'modal_gain_mod.out_gain_mod'

# --- Training-data tap (does not drive the loop) -----------------------------
slopes2d:
  class:             'Slopes2D'
  inputs:
    # slopecNOSN: the same intensity map as rec's slopec, *without* the
    # slope-null subtraction, and the network must be fed from it wherever it
    # runs. The static illumination pattern that the subtraction removes is
    # what tells the network how large the residual is: its first block ends
    # in a GroupNorm, so its output does not change when the whole input map
    # is scaled, and a zero-mean map scales with the residual: tripling the
    # residual changes the output by 0.4%, against 45% with the pattern kept.
    in_slopes:       'slopecNOSN.out_slopes'
  outputs: ['out_value']

# The labels come from the base config's modal_analysis: the 630 KL modes of
# the residual phase.

data_buffer:
  class:             'DataBuffer'
  buffer_size:       1000   # ~0.59 s of loop per training trigger
  inputs:
    input_list: ['input_2d-slopes2d.out_value',
                 'modes-modal_analysis.out_modes',
                 'gain_mod-gain_mod_wave.output']

nn_trainer:
  class:             'Conv2dNetTrainer'
  network_filename:  './trained_models/soul_cnn_rec_1f_spatial_m630_g60.pth'
  load_from_file:    true   # resume from network_filename if it exists; the
                             # architecture below must match the saved one
  # Architecture (saved in the checkpoint; the tester and Conv2dNetRec read it
  # from there)
  nmodes:            630    # every mode modal_analysis gives and the loop corrects
  channels:          64
  depth:             4      # 120x120 map -> 7x7 bottleneck
  head_type:         'spatial'  # the decoder's full-resolution output, resampled to
                             # head_grid x head_grid, to the modes through a 512-wide
                             # hidden layer plus a direct linear map: keeps the fine
                             # spatial detail the high-order modes need
  head_grid:         60     # the map holds the pyramid's 4 pupil images, 60x60
                             # each: one cell per subaperture
  input_channels:    1      # slopec has slopes_from_intensity: one intensity map
                             # per frame (x/y slope maps would be 2)
  n_frames:          1      # the current frame only
  conv_block_type:   1      # depthwise separable convolutions
  dropout:           0.1    # against fitting the replay buffer: with less, the
                             # training loss sat far below the loss on new batches
  # Data
  label_offset:      0      # modal_analysis.out_modes has no leading placeholder
  val_split:         0.2
  val_size:          5000   # validation samples kept: the last ~17 s of the run, ~8
                             # seeing draws, so the validation FVU follows the network
                             # rather than the latest conditions
  gain_mod_threshold: 1.0   # drop the frames while the loop is open (gain_mod < 1)
  max_label_rms:     400    # [nm] drop the samples whose residual (modes 0-629, in
                             # quadrature) is larger. A diverging loop, whose batches
                             # run into the thousands, then can't fill the replay
                             # buffer, while the large residuals of a loop pulling in
                             # after an opening -- which the network needs to learn
                             # to close the loop -- are kept. Check against the
                             # diagnostics' "labels this window" line.
  settle_frames:     50     # frames after the loop re-closes that count as transient
                             # (see the diagnostics' "loop transient" table: the
                             # residual is close to the settled one by frame ~50)...
  transient_weight:  0.1    # ...and their weight in the loss. They carry 3-10x the
                             # residual of a settled frame and would otherwise
                             # dominate the gradient; the loop mostly runs settled.
  norm_timescale:    30.0   # [s] time constant of the moving average of the output
                             # statistics: the atmosphere keeps changing, and 30 s
                             # spans ~15 seeing draws. Each update rescales the output
                             # layers, so the predictions don't change with it.
  # Replay buffer: every trigger adds its training frames to a buffer and
  # trains on minibatches drawn from all of it, so the network doesn't forget
  # the earlier conditions.
  replay_size:       30000  # samples (~1.7 GB of CPU RAM at 120x120); full after
                             # ~150 triggers
  replay_subsample:  4      # every 4th frame (2.4 ms apart): consecutive frames
                             # are nearly identical
  replay_ratio:      20     # minibatch draws per new sample (~55 steps per trigger);
                             # training time per trigger scales with it
  replay_batch:      64
  # Optimization
  loss_delta:        10.0   # [nm] Huber loss transition point: large-residual samples
                             # count linearly, so they don't dominate the loss
  norm_loss_weight:  5.0    # extra loss term, the error per mode normalized by the
                             # mode's spread: in the nm loss modes 20-99 (~3-5 nm)
                             # weigh ~30x less than modes 0-4 (~130 nm). Higher values
                             # spent capacity on modes that are mostly noise.
  grad_clip_value:   20     # the median gradient norm is ~2: this only catches spikes
  lr_decay:          0.995  # learning rate x0.995 per trigger, from 1e-3: ~4e-4 at the
                             # end of a 100 s run (~170 triggers), ~2e-4 after two. It is
                             # saved in the checkpoint, so a resumed run continues the
                             # annealing. At 0.999 it stayed above 8e-4 for a whole run
                             # (and restarted at 1e-3 on every resume): the weights kept
                             # jittering around a solution instead of settling on it.
  inputs:
    input_2d_batch:  'data_buffer.input_2d_buffered'
    labels:          'data_buffer.modes_buffered'
    gain_mod:        'data_buffer.gain_mod_buffered'
  outputs: ['loss', 'val_loss']

# The losses are printed every step and stored in the diagnostics file, so no
# display is wired up (a PlotDisplay over X11 has taken a whole run down). To
# watch them live, add:
#
# loss_disp:
#   class:             'PlotDisplay'
#   inputs:
#     value_list: ['nn_trainer.loss', 'nn_trainer.val_loss']
#   labels:            ['train', 'val']
#   title:             'Conv2dNetTrainer loss (nm)'
