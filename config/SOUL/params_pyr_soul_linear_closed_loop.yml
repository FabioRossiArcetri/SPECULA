---
# Closed loop with the linear reconstructor, in the same conditions as
# params_pyr_soul_cnn_closed_loop.yml: the reference to compare the CNN against.
#
#   specula params_pyr_soul.yml params_pyr_soul_linear_closed_loop.yml
#
# Everything else is left to the base config, as in the CNN closed loop: the
# same atmosphere (constant seeing and wind, same seed), the same non-modulated
# pyramid, the same control tuning and DM. The only difference is what
# computes the modes from the slopes:
#
#   this file:                         rec (Modalrec, the base config's
#                                      630-mode linear reconstructor)
#   params_pyr_soul_cnn_closed_loop:   modalrec (Conv2dNetRec)
#
# data_store is not needed here, and its store_dir in the base config is not
# writable for everyone.

remove: ['data_store']

pyramid_override:
  mod_amp: 0.0   # non-modulated pyramid

control_override:
  # The same groups and gains as the CNN closed loop (and the training loop)
  #                 0-29    30-99     100-199   200-499   500-629
  n_modes:           [30,     70,       100,      300,      130]
  int_gain:          [0.45,   0.35,     0.18,     0.08,     0.05]
  ff:                [1.0,    0.999996, 0.999365, 0.977895, 0.99]

dm_override:
  nmodes:            630    # the modes control corrects

# The Strehl is logged by psf every step. To watch it live, add:
#
# sr_disp:
#   class:             'PlotDisplay'
#   inputs:
#     value:           'psf.out_sr'
#   title:             'SR (linear closed loop)'
