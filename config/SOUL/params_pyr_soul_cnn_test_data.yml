---
# Evaluation of the CNN reconstructor trained by
# params_pyr_soul_cnn_train_data.yml, on data it has not seen:
#
#   specula params_pyr_soul.yml params_pyr_soul_cnn_test_data.yml
#
# The same loop and tap as the training config -- the linear reconstructor
# drives the loop, the network only watches -- with Conv2dNetTester in place
# of the trainer: no gradient updates, just the network's error on each batch
# against modal_analysis, next to the linear reconstructor's own error on the
# same frames. The per-mode gains are not randomized here: the loop runs at its
# nominal tuning, as it would in operation.
#
# The atmosphere generators have no seed, so every run draws a new sequence.

main_override:
  total_time:        3.0    # [s]

pyramid_override:
  mod_amp: 0.0   # non-modulated pyramid

# --- Varying atmosphere: as in the training config (see there) -----------------
remove: ['seeing', 'wind_speed', 'wind_direction', 'data_store']

seeing:
  class:             'PeriodicRandomGenerator'
  update_interval:   2.0                    # [s]
  distribution:      'UNIFORM'
  constant:          [0.9]                  # ["]
  amp:               [0.6]                  # ["] -> uniform in [0.6, 1.2]
  output_size:       1

wind_speed:
  class:             'PeriodicRandomGenerator'
  update_interval:   3.0                    # [s]
  distribution:      'UNIFORM'
  constant:          [2., 4., 6., 25.]      # [m/s] one per layer, the base config's values
  amp:               [2., 4., 6., 25.]      # [m/s] -> uniform in [0, 2x nominal]
  output_size:       4

wind_direction:
  class:             'PeriodicRandomGenerator'
  update_interval:   5.0                    # [s]
  distribution:      'UNIFORM'
  constant:          [0., 30., -30., 45.]   # [deg] one per layer, the base config's values
  amp:               [180., 180., 180., 180.]  # [deg] -> +/-90 deg around them
  output_size:       4

atmo_override:
  inputs:
    seeing:          'seeing.output'
    wind_speed:       'wind_speed.output'
    wind_direction:   'wind_direction.output'

# --- Loop opening: as in the training config (see there) -----------------------
gain_mod_wave:
  class:             'WaveGenerator'
  wave_type:         'SQUARE'
  freq:              [1.0]
  amp:               [0.5]
  constant:          [0.5]
  duty_cycle:        [0.95]
  offset:            [4.39822971502571]     # 0.70 * 2*pi: opens at k + 0.25 s
  outputs: ['output']

control_override:
  # The training config's tuning (see there)
  #                 0-29    30-99     100-199   200-499   500-629
  n_modes:           [30,     70,       100,      300,      130]
  int_gain:          [0.45,   0.35,     0.18,     0.08,     0.05]
  ff:                [1.0,    0.999996, 0.999365, 0.977895, 0.99]
  inputs:
    delta_comm:      'rec.out_modes'
    gain_mod:        'gain_mod_wave.output'

# --- CNN evaluation tap (does not drive the loop) --------------------------------
slopes2d:
  class:             'Slopes2D'
  inputs:
    in_slopes:       'slopecNOSN.out_slopes'  # the same slope computer as in training (see there)
  outputs: ['out_value']

data_buffer:
  class:             'DataBuffer'
  buffer_size:       128    # ~75 ms per evaluation batch
  inputs:
    input_list: ['input_2d-slopes2d.out_value',
                 'modes-modal_analysis.out_modes',
                 'gain_mod-gain_mod_wave.output',
                 # the linear reconstructor's estimate of the same modes, scored
                 # by nn_tester on exactly the same frames
                 'reference-rec.out_modes']

nn_tester:
  class:             'Conv2dNetTester'
  # The network (architecture, nmodes, input_channels, n_frames) is read from
  # the checkpoint the training config saves.
  network_filename:  './trained_models/soul_cnn_rec_1f_spatial_m630_g60.pth'
  label_offset:      0      # modal_analysis.out_modes has no leading placeholder
  gain_mod_threshold: 1.0   # leave out the frames while the loop is open
  inputs:
    input_2d_batch:  'data_buffer.input_2d_buffered'
    labels:          'data_buffer.modes_buffered'
    gain_mod:        'data_buffer.gain_mod_buffered'
    reference:       'data_buffer.reference_buffered'
  outputs: ['loss', 'prediction']
  target_device_idx: 1      # a specific GPU on this shared machine; check nvidia-smi

# The Strehl of the loop that runs here is the *linear* loop's, context for the
# conditions only. To watch it live, add:
#
# sr_disp:
#   class:             'PlotDisplay'
#   inputs:
#     value:           'psf.out_sr'
#   title:             'SR (linear loop)'
