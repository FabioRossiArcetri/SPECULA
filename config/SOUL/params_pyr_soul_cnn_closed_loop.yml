---
# Closed loop driven by the CNN reconstructor trained by
# params_pyr_soul_cnn_train_data.yml: Conv2dNetRec replaces the linear `rec`.
#
#   specula params_pyr_soul.yml params_pyr_soul_cnn_closed_loop.yml
#
# The conditions are the base config's (constant seeing and wind, no loop
# opening, no gain randomization): those perturbations exist to diversify the
# training data, not to measure performance. params_pyr_soul_linear_closed_loop.yml
# runs the linear reconstructor in the same conditions, for comparison.
#
# data_store is not needed here, and its store_dir in the base config is not
# writable for everyone.

pyramid_override:
  mod_amp: 0.0   # non-modulated pyramid

remove: ['rec', 'data_store']

modalrec:
  class:             'Conv2dNetRec'
  # The network (architecture, nmodes, input_channels, n_frames) is read from
  # the checkpoint, so nothing here can disagree with the weights.
  network_filename:  './trained_models/soul_cnn_rec_1f_spatial_m630_g60.pth'
  calibrate_gain:    true   # the predictions are shrunk towards the mean, by a
                             # factor that varies per mode, and in the loop that acts
                             # as a lower gain. This undoes it with the prediction
                             # gain the trainer measured and saved, so int_gain below
                             # is the effective loop gain, valid across retrains.
  inputs:
    in_slopes:       'slopecNOSN.out_slopes'  # the slope computer the network was trained on,
                                              # without the slope-null subtraction (see the
                                              # training config)
  outputs: ['out_modes']

control_override:
  # The training loop's groups and gains (see the training config): the network
  # learned the residual of a loop tuned this way, and with calibrate_gain on
  # these are also its effective gains. If the loop oscillates, scale the whole
  # row by 0.7 before anything else.
  #                 0-29    30-99     100-199   200-499   500-629
  n_modes:           [30,     70,       100,      300,      130]
  int_gain:          [0.45,   0.35,     0.18,     0.08,     0.05]
  ff:                [1.0,    0.999996, 0.999365, 0.977895, 0.99]
  inputs:
    delta_comm:      'modalrec.out_modes'   # rec was removed, and its wires with it

dm_override:
  nmodes:            630    # the modes control corrects

# Live Strehl of the CNN-driven loop. Requires a display (e.g. X11 forwarding);
# the Strehl is also logged by psf, so this can be removed.
sr_disp:
  class:             'PlotDisplay'
  inputs:
    value:           'psf.out_sr'
  title:             'SR (CNN closed loop)'
