---
# How much of the mid-order error comes from the conditions changing?
#
# Fourth file on top of the usual two:
#   specula params_pyr_soul.yml params_pyr_soul_cnn_train_data.yml params_pyr_soul_cnn_fixed_seeing.yml
#
# In the training run (seeing redrawn in 0.4-1.2" every 2 s, loop gains
# randomized per mode) modes 50-199 are unpredictable on new data: the CNN
# reaches a forward-in-time FVU of ~0.65-1.05 there, and a linear ridge map
# fitted on the same past samples reaches ~0.91-1.16. Two explanations fit
# that equally well:
#
#   a) the input -> mode relation itself moves, because a non-modulated
#      pyramid's optical gain follows the seeing, so a map fitted on the past
#      no longer applies to the next batch;
#   b) those modes are simply below the noise: at ~2 nm each there is nothing
#      to measure, whatever the conditions.
#
# This run holds the seeing fixed and leaves everything else alone. The number
# that separates the two is the *linear ridge, forward in time* FVU per mode
# group (the "fwd: ... ridge_FVU" column, and the "linear ridge forward in
# time, settled frames only" line): if it drops well below the ~1 seen with
# varying seeing, the limit is (a), the changing conditions, and the network
# needs to be given them -- more frames, or an explicit conditioning input.
# If it stays at ~1, the limit is (b), photon noise, and no reconstructor of
# any kind will do better on those modes.
#
# The CNN is barely trained here (1 minibatch step per trigger), so it says
# nothing; only the ridge numbers matter, and they don't depend on it.

main_override:
  total_time:        20.0   # ~34 triggers: enough for several diagnostics blocks

# The train config redefines seeing as a PeriodicRandomGenerator; amp 0 makes
# it constant at the value below, with the same object and wiring.
seeing_override:
  constant:          [0.8]
  amp:               [0.0]

nn_trainer_override:
  network_filename:  './trained_models/fixed_seeing_check.pth'   # keeps the real checkpoint untouched
  load_from_file:    false
  replay_steps:      1      # the CNN is not what's being measured here
  diag_interval:     5
