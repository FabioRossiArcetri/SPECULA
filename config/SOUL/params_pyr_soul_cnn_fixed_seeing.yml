---
# Diagnostic: how much of the mid-order error comes from the conditions
# changing?
#
#   specula params_pyr_soul.yml params_pyr_soul_cnn_train_data.yml params_pyr_soul_cnn_fixed_seeing.yml
#
# Where the modes are hard to predict on new data (forward-in-time FVU ~1),
# two explanations fit equally well:
#
#   a) the input -> mode relation itself moves: a non-modulated pyramid's
#      optical gain follows the seeing, so a map fitted on the past no longer
#      applies to the next batch;
#   b) the modes are below the noise: there is nothing to measure, whatever
#      the conditions.
#
# This run holds the seeing fixed and leaves everything else as in training.
# The number that separates the two is the linear ridge's forward-in-time FVU
# per mode group (the "fwd: ... ridge_FVU" column and the "forward in time"
# line): if it drops well below what the training run shows, the limit is (a)
# and the network needs to be given the conditions -- more frames, or an
# explicit input. If it stays at ~1, the limit is (b), and no reconstructor
# will do better on those modes.
#
# The CNN is barely trained here, and the ridge numbers don't depend on it.

main_override:
  total_time:        20.0   # ~34 triggers: several diagnostics blocks

# amp 0 makes the training config's seeing generator constant
seeing_override:
  constant:          [0.8]
  amp:               [0.0]

nn_trainer_override:
  network_filename:  './trained_models/fixed_seeing_check.pth'   # keeps the real checkpoint untouched
  load_from_file:    false
  replay_ratio:      0.01   # one minibatch step per trigger, the minimum
  diag_interval:     5
