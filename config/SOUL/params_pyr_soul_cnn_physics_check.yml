---
# Diagnostic: is there information about the mid-order modes in the
# non-modulated pyramid slopes once the residual is small?
#
#   specula params_pyr_soul.yml params_pyr_soul_cnn_train_data.yml params_pyr_soul_cnn_physics_check.yml
#
# A large residual takes the non-modulated pyramid out of its linear range.
# This run shrinks it with a fixed, good seeing and looks at the linear ridge's
# forward-in-time FVU per mode group (the "fwd: ... ridge_FVU" column and the
# "forward in time" line). Check first that the residual actually dropped: the
# "labels this window" line reports it.
#
# The CNN is barely trained here, and the ridge numbers don't depend on it.

main_override:
  total_time:        30.0   # ~50 triggers

# amp 0 makes the training config's seeing generator constant
seeing_override:
  constant:          [0.4]
  amp:               [0.0]

nn_trainer_override:
  network_filename:  './trained_models/physics_check.pth'   # keeps the real checkpoint untouched
  load_from_file:    false
  replay_ratio:      0.01   # one minibatch step per trigger, the minimum
  diag_interval:     5
