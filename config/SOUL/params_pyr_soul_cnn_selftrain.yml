---
# Self-training: the CNN drives the loop and keeps training on the data that
# loop produces.
#
#   specula params_pyr_soul.yml params_pyr_soul_cnn_closed_loop.yml params_pyr_soul_cnn_selftrain.yml
#
# The first training round learns the residual of a loop driven by the linear
# reconstructor; a loop driven by the network itself has a different residual,
# with its own errors fed back into the next measurement. Here the training
# data come from the regime the network actually works in.
#
# Conv2dNetRec loads the checkpoint once, at construction, and drives the whole
# run with those weights, while nn_trainer trains a copy and overwrites the
# checkpoint every 10 steps. One run is therefore one iteration: run it again
# to iterate, and keep a copy of the earlier checkpoint to compare.
#
# The loop is never opened and the gains are not randomized (this is the
# operating regime), so there is no gain_mod input and no re-close transient to
# weight.
#
# Copy the checkpoint before a run: this one overwrites it.

# --- Conditions: not the evaluation's ------------------------------------------
# The closed-loop config runs the base atmosphere (seed 1, fixed seeing and
# wind), which is also where the CNN is compared with the linear reconstructor.
# Training on it would teach the network the very phase screens it is scored
# on, and a single condition. So here the atmosphere has its own seed and the
# seeing and wind vary as in the training config (see there: the direction is
# drawn once per run).
remove: ['seeing', 'wind_speed', 'wind_direction']

seeing:
  class:             'PeriodicRandomGenerator'
  update_interval:   2.0                    # [s]
  distribution:      'UNIFORM'
  constant:          [0.9]                  # ["]
  amp:               [0.6]                  # ["] -> uniform in [0.6, 1.2]
  output_size:       1

wind_speed:
  class:             'PeriodicRandomGenerator'
  update_interval:   3.0                    # [s]
  distribution:      'UNIFORM'
  constant:          [2., 4., 6., 25.]      # [m/s] one per layer, the base config's values
  amp:               [2., 4., 6., 25.]      # [m/s] -> uniform in [0, 2x nominal]
  output_size:       4

wind_direction:
  class:             'PeriodicRandomGenerator'
  update_interval:   1000000.0              # [s] longer than any run: one draw per run
  distribution:      'UNIFORM'
  constant:          [0., 30., -30., 45.]   # [deg] one per layer
  amp:               [180., 180., 180., 180.]  # [deg] -> +/-90 deg around them
  output_size:       4

atmo_override:
  seed:              2      # not the evaluation's seed (1)
  inputs:
    seeing:          'seeing.output'
    wind_speed:      'wind_speed.output'
    wind_direction:  'wind_direction.output'

# --- Training-data tap -----------------------------------------------------------
slopes2d:
  class:             'Slopes2D'
  inputs:
    in_slopes:       'slopecNOSN.out_slopes'  # what Conv2dNetRec is fed
  outputs: ['out_value']

data_buffer:
  class:             'DataBuffer'
  buffer_size:       1000
  inputs:
    input_list: ['input_2d-slopes2d.out_value',
                 'modes-modal_analysis.out_modes']

nn_trainer:
  class:             'Conv2dNetTrainer'
  # The file modalrec loaded, refined in place. The architecture must match
  # the one saved in it (checked on load); the other parameters are the
  # training config's (see there).
  network_filename:  './trained_models/soul_cnn_rec_1f_spatial_m630_g60.pth'
  load_from_file:    true
  nmodes:            630
  channels:          64
  depth:             4
  head_type:         'spatial'
  head_grid:         60
  input_channels:    1
  n_frames:          1
  conv_block_type:   1
  dropout:           0.1
  label_offset:      0
  val_split:         0.2
  val_size:          5000
  max_label_rms:     400    # also keeps a loop that goes bad from filling the buffer
  norm_timescale:    30.0   # continues the moving average saved in the stats file
  replay_size:       30000
  replay_subsample:  4
  replay_ratio:      20
  replay_batch:      64
  loss_delta:        10.0
  norm_loss_weight:  5.0
  grad_clip_value:   20
  lr_decay:          0.999
  inputs:
    input_2d_batch:  'data_buffer.input_2d_buffered'
    labels:          'data_buffer.modes_buffered'
  outputs: ['loss', 'val_loss']
